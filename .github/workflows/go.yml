name: Go

on:
  push:
  pull_request:
    branches: [ 'develop' ]

permissions:
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up pnpm
      # Needed by `make assets`: pinner owns the MCP App JS source
      # (packages/apps), so `make jsbuild` builds the bundles from this repo
      # itself (pnpm build via tsdown) and stages them into
      # canvasassets/appsassets/dist/. `make cssbuild` compiles the Tailwind
      # theme. No external JS checkout is needed.
      uses: pnpm/action-setup@v4
      with:
        version: 10.33.2

    - name: Generate app assets
      # Regenerates the gitignored embedded assets (canvasassets/appsassets/
      # bundles + manifest and css/tailwind.css) that the go:embed directives
      # require at build time: `make assets` = jsbuild (this repo's apps build)
      # + cssbuild + genappmanifest.
      run: make assets

    - name: JS tests
      run: pnpm test

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Generate coverage report
      run: go tool cover -func=coverage.out

    - name: Extract coverage percentage
      if: github.event_name == 'pull_request'
      id: coverage
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | grep -oP '\d+\.\d+')
        echo "percent=$COVERAGE%" >> $GITHUB_OUTPUT

    - name: Find coverage comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/find-comment@v3
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: 'Code Coverage Report'

    - name: Create or update coverage comment
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## Code Coverage Report
          
          **Total Coverage:** ${{ steps.coverage.outputs.percent }}
          
          Generated from commit: ${{ github.sha }}
          **Repository:** ${{ github.repository }}
        edit-mode: replace
